# Alembic-Konfiguration für den Inventar-Starter.
# Aufruf im Container:  docker compose exec api alembic upgrade head

[alembic]
script_location = backend/migrations
prepend_sys_path = .
version_path_separator = os

# Im Docker-Netz heißt der DB-Host "db". Wird DB_DSN gesetzt (wie im api-Service),
# überschreibt backend/migrations/env.py diesen Wert.
sqlalchemy.url = postgresql+psycopg://appuser:apppass@db:5432/appdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
